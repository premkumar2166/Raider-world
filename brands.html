<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Brands | Raiders World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .page-header { padding: 120px 0 60px; text-align: center; background: url('https://images.unsplash.com/photo-1558981403-c5f9899a28bc?auto=format&fit=crop&q=80') center/cover no-repeat; position: relative; }
        .page-header::before { content: ''; position: absolute; inset: 0; background: rgba(10,10,13,0.85); }
        .page-header .container { position: relative; z-index: 1; }
        #brandResultsHeader { display: none; margin-bottom: 2rem; padding-top: 2rem; border-top: 1px solid var(--border-glass); }
    </style>
</head>
<body class="dark-theme">
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <span class="logo-text">RAIDERS</span><span class="logo-accent">WORLD</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Parts & Bikes</a>
                <a href="gear.html">Rider Gear</a>
                <a href="brands.html" class="active">Brands</a>
                <a href="marketplace.html">Buy/Sell Bikes</a>
                <a href="services.html">Services</a>
                <a href="scanning.html">Bike Scanning</a>
                <a href="tracker.html">Bike Location</a>
                <a href="about.html">About</a>
                <a href="login.html" class="text-accent">Login</a>
            </nav>
            <div class="nav-actions">
                <button class="icon-btn search-trigger" aria-label="Search"><i data-lucide="search"></i></button>
                <a href="cart.html" class="icon-btn cart-btn"><i data-lucide="shopping-cart"></i><span class="cart-badge">0</span></a>
            </div>
        </div>
    </header>

    <main>
        <section class="page-header">
            <div class="container">
                <h1 class="hero-title">Trusted <span class="text-accent">Brands</span></h1>
                <p class="hero-subtitle" style="margin: 0 auto;">Shop performance parts and bikes from industry leaders.</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="brand-search-wrapper">
                    <input type="text" class="brand-search-input" id="brandSearch" placeholder="Find a brand (Yamaha, Brembo, etc.)..." oninput="BrandPage.filter(this.value)">
                </div>

                <div id="brandGrid" class="brand-grid">
                    <!-- Brands loaded via JS -->
                </div>

                <div id="brandResultsHeader">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h2>Available products from <span id="activeBrandName" class="text-accent"></span></h2>
                        <button class="btn btn-outline" onclick="BrandPage.reset()"><i data-lucide="arrow-left"></i> Back to Brands</button>
                    </div>
                </div>
                <div id="brandProductsGrid" class="grid grid-3" style="display:none; margin-top:2rem;">
                    <!-- Products loaded via JS -->
                </div>
            </div>
        </section>
    </main>

    <footer class="footer"><div class="footer-bottom container"><p>&copy; 2026 Raiders World.</p></div></footer>

    <script src="script.js"></script>
    <script>
        const BrandPage = {
            brands: [
                { name: "Yamaha", type: "Bike", icon: "bike" },
                { name: "Honda", type: "Bike", icon: "bike" },
                { name: "KTM", type: "Bike", icon: "bike" },
                { name: "Royal Enfield", type: "Bike", icon: "bike" },
                { name: "Suzuki", type: "Bike", icon: "bike" },
                { name: "Bajaj", type: "Bike", icon: "bike" },
                { name: "TVS", type: "Bike", icon: "bike" },
                { name: "Ducati", type: "Bike", icon: "bike" },
                { name: "Kawasaki", type: "Bike", icon: "bike" },
                { name: "BMW", type: "Bike", icon: "bike" },
                { name: "Triumph", type: "Bike", icon: "bike" },
                { name: "Axor", type: "Gear", icon: "shield" },
                { name: "Rynox", type: "Gear", icon: "shirt" },
                { name: "Quad Lock", type: "Product", icon: "smartphone" },
                { name: "Akrapovič", type: "Parts", icon: "zap" },
                { name: "Brembo", type: "Parts", icon: "disc" },
                { name: "Pirelli", type: "Parts", icon: "circle" },
                { name: "Öhlins", type: "Parts", icon: "activity" },
                { name: "Motul", type: "Maintenance", icon: "droplet" }
            ],

            init() {
                this.renderBrands(this.brands);
            },

            renderBrands(list) {
                const grid = document.getElementById('brandGrid');
                grid.innerHTML = list.map(b => `
                    <div class="brand-card" onclick="BrandPage.showProducts('${b.name}')">
                        <div class="brand-logo-container">
                            ${b.logo ? `<img src="${b.logo}" class="brand-logo-img" alt="${b.name}">` : `<i data-lucide="${b.icon}"></i>`}
                        </div>
                        <h3>${b.name}</h3>
                        <span class="brand-type-tag">${b.type}</span>
                    </div>
                `).join('');
                if(window.lucide) lucide.createIcons();
            },

            filter(query) {
                const term = query.toLowerCase();
                const filtered = this.brands.filter(b => b.name.toLowerCase().includes(term));
                this.renderBrands(filtered);
                this.resetViews();
            },

            showProducts(brandName) {
                const grid = document.getElementById('brandGrid');
                const resultsHeader = document.getElementById('brandResultsHeader');
                const productsGrid = document.getElementById('brandProductsGrid');
                const nameEl = document.getElementById('activeBrandName');

                grid.style.display = 'none';
                resultsHeader.style.display = 'block';
                productsGrid.style.display = 'grid';
                nameEl.textContent = brandName;

                const allItems = [...SearchManager.staticDB, ...(JSON.parse(localStorage.getItem('raiders_products')) || [])];
                const filtered = allItems.filter(item => item.title.toLowerCase().includes(brandName.toLowerCase()));

                if (filtered.length === 0) {
                    productsGrid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 4rem; color: var(--text-secondary);">No items for ${brandName} found in the current inventory.</div>`;
                } else {
                    productsGrid.innerHTML = filtered.map(item => `
                        <div class="card product-card">
                            <div class="card-image" style="background-image: url('${item.image}')"></div>
                            <div class="card-content">
                                <div class="card-meta">${item.category}</div>
                                <h3 class="card-title">${item.title}</h3>
                                <div class="card-footer"><span class="price">₹${parseFloat(item.price).toLocaleString()}</span><button class="btn btn-icon add-to-cart" data-title="${item.title}" data-price="${item.price}" data-category="${item.category}" data-image="${item.image}"><i data-lucide="plus"></i></button></div>
                            </div>
                        </div>`).join('');
                }
                if(window.lucide) lucide.createIcons();
                resultsHeader.scrollIntoView({ behavior: 'smooth' });
            },

            reset() { this.resetViews(); this.renderBrands(this.brands); document.getElementById('brandSearch').value = ''; },
            resetViews() { document.getElementById('brandGrid').style.display = 'grid'; document.getElementById('brandResultsHeader').style.display = 'none'; document.getElementById('brandProductsGrid').style.display = 'none'; }
        };
        document.addEventListener('DOMContentLoaded', () => BrandPage.init());
    </script>
</body>
</html>
