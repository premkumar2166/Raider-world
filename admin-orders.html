<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales & Orders | Owner Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { margin: 0; padding: 0; display: flex; min-height: 100vh; background-color: #0b0b0e; color: var(--text-primary); }
        .sidebar { width: 280px; background: rgba(10,10,13,0.98); border-right: 1px solid var(--border-glass); padding: 2rem 1.5rem; display: flex; flex-direction: column; gap: 2rem; position: fixed; height: 100vh; z-index: 10; }
        .main-content { margin-left: 280px; padding: 2rem 3rem; flex: 1; min-height: 100vh; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; gap: 1rem; padding: 1rem; color: var(--text-secondary); text-decoration: none; border-radius: 0.5rem; transition: var(--transition); }
        .nav-item:hover, .nav-item.active { background: rgba(245, 158, 11, 0.1); color: var(--accent-color); border-left: 3px solid var(--accent-color); }
        .panel { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-glass); border-radius: 1rem; padding: 1.5rem; backdrop-filter: blur(10px); }
        
        .badge { padding: 0.25rem 0.5rem; border-radius: 1rem; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-pending { background: rgba(245, 158, 11, 0.2); color: var(--accent-color); border: 1px solid rgba(245, 158, 11, 0.5); }
        .badge-success { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.5); }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.5); }
        
        .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
    </style>
</head>
<body class="dark-theme carbon-fiber">

    <aside class="sidebar">
        <a href="index.html" class="logo" style="margin-bottom: 2rem;">
            <span class="logo-text">OWNER</span><span class="logo-accent">PORTAL</span>
        </a>
        <nav style="display: flex; flex-direction: column; gap: 0.5rem;">
            <a href="admin.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Control Center</a>
            <a href="admin-orders.html" class="nav-item active"><i data-lucide="shopping-cart"></i> Sales & Orders</a>
            <a href="admin-inventory.html" class="nav-item"><i data-lucide="package-plus"></i> Store Inventory</a>
            <a href="admin-otp.html" class="nav-item"><i data-lucide="shield-alert"></i> OTP Tracking Logs</a>
            <a href="admin-dispatch.html" class="nav-item"><i data-lucide="truck"></i> Service Dispatch</a>
            <a href="admin-engine.html" class="nav-item"><i data-lucide="file-check"></i> Transparency Engine</a>
            <a href="admin-scanning.html" class="nav-item"><i data-lucide="scan"></i> Scanning Analysis</a>
            <a href="admin-mechanics.html" class="nav-item"><i data-lucide="users"></i> Mechanic Applications</a>
        </nav>
    </aside>

    <main class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-glass); padding-bottom: 1.5rem;">
            <div>
                <h1 style="font-size: 2.2rem; margin-bottom: 0.5rem; font-weight: 800;">Order Management</h1>
                <p class="text-secondary" style="font-size: 1.1rem;">Review and process incoming storefront orders.</p>
            </div>
            <div style="display: flex; gap: 1rem;">
                <div class="panel" style="padding: 0.5rem 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
                    <div style="width: 10px; height: 10px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981;"></div>
                    <span>Live Orders Active</span>
                </div>
            </div>
        </div>

        <div class="filter-bar" style="margin-bottom: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
            <button class="btn btn-outline active" onclick="filterOrdersByBrand('all', this)">All Brands</button>
            <button class="btn btn-outline" onclick="filterOrdersByBrand('Ducati', this)">Ducati</button>
            <button class="btn btn-outline" onclick="filterOrdersByBrand('KTM', this)">KTM</button>
            <button class="btn btn-outline" onclick="filterOrdersByBrand('Royal Enfield', this)">Royal Enfield</button>
            <button class="btn btn-outline" onclick="filterOrdersByBrand('Axor', this)">Axor</button>
            <button class="btn btn-outline" onclick="filterOrdersByBrand('Rynox', this)">Rynox</button>
        </div>

        <div id="adminOrdersList" class="orders-grid">
            <!-- Orders will be injected here by script.js -->
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        let lastOrderCount = (JSON.parse(localStorage.getItem('raiders_orders')) || []).length;
        const orderSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3');

        document.addEventListener('DOMContentLoaded', () => {
            AdminOrderManager.init();
            lucide.createIcons();
        });

        // Real-time update when an order is placed in another tab
        window.addEventListener('storage', (event) => {
            if (event.key === 'raiders_orders') {
                const orders = JSON.parse(event.newValue) || [];
                if (orders.length > lastOrderCount) {
                    orderSound.play().catch(e => {});
                }
                lastOrderCount = orders.length;
                AdminOrderManager.renderOrders(true); // Pass true to indicate a refresh
            }
        });

        function filterOrdersByBrand(brand, element) {
            // Update active button
            document.querySelectorAll('.filter-bar .btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            
            // Set filter and re-render
            AdminOrderManager.setFilter(brand);
        }
    </script>
</body>
</html>
