<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatch | Raiders World Owner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { margin: 0; padding: 0; display: flex; min-height: 100vh; background-color: #0b0b0e; color: var(--text-primary); }
        .sidebar { width: 280px; background: rgba(10,10,13,0.98); border-right: 1px solid var(--border-glass); padding: 2rem 1.5rem; display: flex; flex-direction: column; gap: 2rem; position: fixed; height: 100vh; z-index: 10; }
        .main-content { margin-left: 280px; padding: 2rem 3rem; flex: 1; min-height: 100vh; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; gap: 1rem; padding: 1rem; color: var(--text-secondary); text-decoration: none; border-radius: 0.5rem; transition: var(--transition); }
        .nav-item:hover, .nav-item.active { background: rgba(245, 158, 11, 0.1); color: var(--accent-color); border-left: 3px solid var(--accent-color); }
        .panel { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-glass); border-radius: 1rem; padding: 1.5rem; backdrop-filter: blur(10px); }
        
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
    </style>
</head>
<body class="dark-theme carbon-fiber">

    <aside class="sidebar">
        <a href="index.html" class="logo" style="margin-bottom: 2rem;">
            <span class="logo-text">OWNER</span><span class="logo-accent">PORTAL</span>
        </a>
        <nav style="display: flex; flex-direction: column; gap: 0.5rem;">
            <a href="admin.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Control Center</a>
            <a href="admin-orders.html" class="nav-item"><i data-lucide="shopping-cart"></i> Sales & Orders</a>
            <a href="admin-inventory.html" class="nav-item"><i data-lucide="package-plus"></i> Store Inventory</a>
            <a href="admin-otp.html" class="nav-item"><i data-lucide="shield-alert"></i> OTP Tracking Logs</a>
            <a href="admin-dispatch.html" class="nav-item active"><i data-lucide="truck"></i> Service Dispatch</a>
            <a href="admin-engine.html" class="nav-item"><i data-lucide="file-check"></i> Transparency Engine</a>
            <a href="admin-scanning.html" class="nav-item"><i data-lucide="scan"></i> Scanning Analysis</a>
            <a href="admin-mechanics.html" class="nav-item"><i data-lucide="users"></i> Mechanic Applications</a>
        </nav>
    </aside>

    <main class="main-content">
        <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 0.5rem;">Service Dispatch & Delivery Routing</h1>
        <p class="text-secondary" style="margin-bottom: 2rem;">Live monitoring of repaired bikes being delivered back to customers.</p>

        <!-- Big Global Map Mockup -->
        <div class="panel" style="padding: 0; overflow: hidden; height: 350px; margin-bottom: 2rem; position: relative;">
            <div style="width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1524661135-42353a238698?auto=format&fit=crop&q=80') center/cover; opacity: 0.8;"></div>
            
            <!-- Map Markers -->
            <div style="position: absolute; top: 40%; left: 30%; color: #10b981;"><div class="marker-pulse" style="width:40px; height:40px; background: rgba(16,185,129,0.3)"></div><i data-lucide="truck" style="position:absolute; transform: translate(-50%, -50%);"></i></div>
            <div style="position: absolute; top: 60%; left: 70%; color: #3b82f6;"><div class="marker-pulse" style="width:40px; height:40px; background: rgba(59,130,246,0.3)"></div><i data-lucide="truck" style="position:absolute; transform: translate(-50%, -50%);"></i></div>
        </div>

        <div class="dashboard-grid" id="dispatchGrid">
            <!-- Dispatches will be injected here by script.js -->
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            AdminDispatchManager.init();
        });
    </script>
</body>
</html>
