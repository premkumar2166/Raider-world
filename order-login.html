<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account | Raiders World</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="creat-order.css">
</head>
<body class="dark-theme">
    <main class="login-page">
        <div class="login-container">
            <div class="login-header">
                <h1>Create Your Account</h1>
                <p>Join the Raiders World community</p>
            </div>

            <form class="login-form" id="signupForm">

                <div class="photo-upload-container">
                    <div class="photo-preview" id="photoPreview">
                        <img class="preview-image" id="previewImage" src="https://via.placeholder.com/80" alt="Photo Preview">
                        <div class="photo-overlay">
                            <i data-lucide="camera" class="camera-icon"></i>
                        </div>
                    </div>
                    <input type="file" id="photoUpload" class="photo-upload" accept="image/*" style="display: none;">
                </div>

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="E.g., John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Minimum 8 characters" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>
                </div>
                
                <button type="submit" class="login-btn">
                    <i data-lucide="user-plus" style="width: 20px; height: 20px;"></i>
                    Create Account
                </button>
            </form>

            <div class="divider">or</div>

            <div class="social-login">
                <button class="social-btn" type="button" onclick="alert('Google sign-up coming soon!')">
                    <i data-lucide="chrome" style="width: 18px; height: 18px;"></i>
                    Sign up with Google
                </button>
            </div>

            <div class="signup-link">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (window.lucide) {
                lucide.createIcons();
            }

            const photoPreview = document.getElementById('photoPreview');
            const photoUpload = document.getElementById('photoUpload');
            const previewImage = document.getElementById('previewImage');

            photoPreview.addEventListener('click', () => {
                photoUpload.click();
            });

            photoUpload.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        previewImage.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });

            const signupForm = document.getElementById('signupForm');
            signupForm.addEventListener('submit', function(event) {
                event.preventDefault();
                
                const fullName = document.getElementById('fullName').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (password.length < 8) {
                    alert('Password must be at least 8 characters long.');
                    return;
                }

                if (password !== confirmPassword) {
                    alert('Passwords do not match.');
                    return;
                }

                alert(`Welcome, ${fullName}! Your account has been created successfully.`);
                
                // Here you would typically send data to a server
                // For this demo, we'll just redirect to the login page
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1000);
            });
        });
    </script>
</body>
</html>
