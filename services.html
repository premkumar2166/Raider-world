<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repair Services | Raiders World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .page-header { padding: 120px 0 60px; text-align: center; background: url('https://images.unsplash.com/photo-1590634676100-8451f22e70e3?auto=format&fit=crop&q=80') center/cover no-repeat; position: relative; }
        .page-header::before { content: ''; position: absolute; inset: 0; background: rgba(10,10,13,0.85); }
        .page-header .container { position: relative; z-index: 1; }
        
        .service-form-container { max-width: 800px; margin: 0 auto; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 1rem; border-radius: 0.5rem;
            background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass);
            color: var(--text-primary); font-family: var(--font-body);
        }
        .form-group select option { background: var(--bg-surface); }
        @media(max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="dark-theme">
    <script>
        // Check if user is logged in, if not redirect to login page
        function checkLogin() {
            const user = localStorage.getItem('raiders_user');
            if (!user) {
                window.location.href = 'login.html';
            }
        }
        checkLogin();
    </script>
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <span class="logo-text">RAIDERS</span><span class="logo-accent">WORLD</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Parts & Bikes</a>
                <a href="gear.html">Rider Gear</a>
                <a href="marketplace.html">Buy/Sell Bikes</a>
                <a href="services.html">Services</a>
                <a href="scanning.html">Bike Scanning</a>
                <a href="tracker.html" class="text-accent">Bike Location</a>
                <a href="about.html">About</a>
                <a href="login.html" class="text-accent">Login</a>
            </nav>
            <div class="nav-actions">
                <div class="profile-container">
                    <button class="icon-btn profile-btn" id="profileBtn" aria-label="Profile">
                        <img src="https://via.placeholder.com/32" alt="Profile" class="profile-photo">
                    </button>
                    <div class="profile-dropdown" id="profileDropdown">
                        <a href="profile.html" class="dropdown-item">
                            <i data-lucide="user"></i> My Profile
                        </a>
                        <a href="#" class="dropdown-item">
                            <i data-lucide="settings"></i> Settings
                        </a>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item" id="loginBtn">
                            <i data-lucide="log-in"></i> Login
                        </button>
                        <button class="dropdown-item" id="logoutBtn" style="display: none;">
                            <i data-lucide="log-out"></i> Logout
                        </button>
                    </div>
                </div>
                <a href="cart.html" class="icon-btn cart-btn" aria-label="Cart" style="display: flex; text-decoration: none;">
                    <i data-lucide="shopping-cart"></i>
                    <span class="cart-badge">0</span>
                </a>
            </div>
        </div>
    </header>

    <main>
        <section class="page-header">
            <div class="container">
                <h1 class="hero-title">Premium <span class="text-accent">Repair Services</span></h1>
                <p class="hero-subtitle" style="margin: 0 auto;">24/7 Support • 1-Year Warranty • Home Delivery</p>
            </div>
        </section>

        <section class="section">
            <div class="container service-form-container">
                <div class="glass-panel" style="padding: 3rem;">
                    <h2 style="margin-bottom: 2rem; font-size: 2rem;">Book a Service</h2>
                    <form onsubmit="event.preventDefault(); alert('Booking Confirmed! Check your Bike Tracker via Homepage.'); window.location.href='index.html';">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" required placeholder="John Doe">
                            </div>
                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="tel" required placeholder="+1 234 567 8900">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Bike Model</label>
                                <input type="text" required placeholder="e.g. Royal Enfield Classic 350">
                            </div>
                            <div class="form-group">
                                <label>Registration Number</label>
                                <input type="text" required placeholder="MH-12-AB-1234">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Service Type</label>
                            <select required>
                                <option value="general">General Maintenance</option>
                                <option value="engine">Engine Rebuild</option>
                                <option value="electrical">Electrical Diagnostics</option>
                                <option value="paint">Custom Paint Job</option>
                            </select>
                        </div>
                        <div class="form-group" style="display: flex; align-items: center; gap: 1rem;">
                            <input type="checkbox" id="homeDelivery" style="width: auto;" checked>
                            <label for="homeDelivery" style="margin: 0;">Include Home Delivery Post-Repair (Trackable via OTP)</label>
                        </div>
                        <div class="form-group">
                            <label>Additional Notes</label>
                            <textarea rows="4" placeholder="Describe any specific issues..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary full-width" style="margin-top: 1rem; padding: 1rem;">Confirm Booking</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer bg-darker">
        <div class="footer-bottom container" style="margin-top:0">
            <p>&copy; 2026 Raiders World.</p>
        </div>
    </footer>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <button class="modal-close" id="closeLoginModal">&times;</button>
            <h2>Welcome Back</h2>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <div class="form-group checkbox">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>
                <button type="submit" class="btn btn-primary full-width">Login</button>
                <p class="form-footer">Don't have an account? <a href="#" class="text-accent">Sign up here</a></p>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
