<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crew Hub Chat | Owner Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { margin: 0; padding: 0; display: flex; min-height: 100vh; background-color: #0b0b0e; color: var(--text-primary); }
        .sidebar { width: 280px; background: rgba(10,10,13,0.98); border-right: 1px solid var(--border-glass); padding: 2rem 1.5rem; display: flex; flex-direction: column; gap: 2rem; position: fixed; height: 100vh; z-index: 10; }
        .main-content { margin-left: 280px; padding: 2rem 3rem; flex: 1; min-height: 100vh; display: flex; flex-direction: column; }
        .nav-item { display: flex; align-items: center; gap: 1rem; padding: 1rem; color: var(--text-secondary); text-decoration: none; border-radius: 0.5rem; transition: var(--transition); }
        .nav-item:hover, .nav-item.active { background: rgba(245, 158, 11, 0.1); color: var(--accent-color); border-left: 3px solid var(--accent-color); }
        .admin-chat-wrapper { flex: 1; margin-top: 1rem; display: flex; flex-direction: column; overflow: hidden; }
    </style>
</head>
<body class="dark-theme carbon-fiber">
    <aside class="sidebar">
        <a href="index.html" class="logo" style="margin-bottom: 2rem;">
            <span class="logo-text">OWNER</span><span class="logo-accent">PORTAL</span>
        </a>
        <nav style="display: flex; flex-direction: column; gap: 0.5rem;">
            <a href="admin.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Control Center</a>
            <a href="admin-orders.html" class="nav-item"><i data-lucide="shopping-cart"></i> Sales & Orders</a>
            <a href="admin-inventory.html" class="nav-item"><i data-lucide="package-plus"></i> Store Inventory</a>
            <a href="admin-otp.html" class="nav-item"><i data-lucide="shield-alert"></i> OTP Tracking Logs</a>
            <a href="admin-dispatch.html" class="nav-item"><i data-lucide="truck"></i> Service Dispatch</a>
            <a href="admin-engine.html" class="nav-item"><i data-lucide="file-check"></i> Transparency Engine</a>
            <a href="admin-scanning.html" class="nav-item"><i data-lucide="scan"></i> Scanning Analysis</a>
            <a href="admin-mechanics.html" class="nav-item"><i data-lucide="users"></i> Mechanic Applications</a>
            <a href="admin-chat.html" class="nav-item active"><i data-lucide="message-square"></i> Crew Hub Chat</a>
        </nav>
    </aside>

    <main class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glass); padding-bottom: 1.5rem;">
            <div>
                <h1 style="font-size: 2.2rem; margin-bottom: 0.5rem; font-weight: 800;">Crew Hub Chat</h1>
                <p class="text-secondary" style="font-size: 1.1rem;">Communicate with the community and moderate discussions.</p>
            </div>
            <div class="panel" style="padding: 0.5rem 1rem; display: flex; align-items: center; gap: 0.5rem; border-color: #10b981;">
                <div style="width: 8px; height: 8px; background: #10b981; border-radius: 50%;" class="pulse"></div>
                <span style="color: #10b981; font-weight: 600;">Hub Live</span>
            </div>
        </div>

        <div class="admin-chat-wrapper">
            <div class="panel chat-main" style="height: 100%; display: flex; flex-direction: column;">
                <div class="chat-header">
                    <div style="width: 45px; height: 45px; background: var(--bg-surface); border-radius: 50%; border: 2px solid var(--accent-color); display:flex; align-items:center; justify-content:center;"><i data-lucide="users" class="text-accent"></i></div>
                    <div>
                        <h3 style="margin:0; font-size: 1.1rem;">Riders Crew Hub</h3>
                        <p style="margin:0; font-size: 0.8rem; color: #10b981;">● Administrative Access</p>
                    </div>
                </div>
                
                <div class="chat-messages" id="messagesArea">
                    <!-- Messages injected here -->
                </div>
                
                <div class="chat-input-area">
                    <div class="chat-input-actions">
                        <label for="mediaInput" title="Send Media"><i data-lucide="image"></i></label>
                        <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="ChatManager.handleMedia(this)">
                        <button onclick="ChatManager.sendSticker()" title="Send Sticker"><i data-lucide="smile"></i></button>
                        <button onclick="ChatManager.sendVoice()" title="Voice Message"><i data-lucide="mic"></i></button>
                    </div>
                    <input type="text" class="chat-input" id="userMsgInput" placeholder="Reply to the crew as Owner...">
                    <button class="icon-btn" id="userSendBtn" style="background: var(--accent-color); color: #fff; border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;"><i data-lucide="send"></i></button>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const adminUser = { name: 'Owner (Raiders HQ)', email: 'admin' };
            ChatManager.initGroupChat(adminUser);
        });
    </script>
</body>
</html>
